<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก — Election Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="6" fill="#1F3A5F"/>
        <path d="M7 12l3 3 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>สมัครสมาชิก</h1>
      <p>สร้างบัญชีเพื่อใช้สิทธิ์ลงคะแนน</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" style="margin-bottom:.5rem;" role="alert">
          <span class="flash-body">{{ message }}</span>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="full_name">ชื่อ-นามสกุล <span class="required">*</span></label>
        <input type="text" id="full_name" name="full_name" class="form-control"
               value="{{ full_name or '' }}" required placeholder="ชื่อ นามสกุล (ใช้ตรวจสอบสิทธิ์)" />
        <div class="form-hint">ต้องตรงกับชื่อจริง — ป้องกันการลงคะแนนซ้ำ</div>
      </div>

      <div class="form-group">
        <label for="username">ชื่อผู้ใช้ <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control"
               value="{{ username or '' }}" required placeholder="ชื่อผู้ใช้" />
      </div>

      <div class="form-group">
        <label for="email">อีเมล <span class="required">*</span></label>
        <input type="email" id="email" name="email" class="form-control"
               value="{{ email or '' }}" required placeholder="example@email.com" />
        <div class="form-hint">ใช้รับ OTP ก่อนลงคะแนน</div>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control"
               required placeholder="อย่างน้อย 8 ตัวอักษร" minlength="8" />
      </div>

      <div class="form-group">
        <label for="confirm_password">ยืนยันรหัสผ่าน <span class="required">*</span></label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
               required placeholder="กรอกรหัสผ่านอีกครั้ง" />
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">สมัครสมาชิก</button>
    </form>

    <p class="text-center text-muted mt-2" style="font-size:.88rem;">
      มีบัญชีแล้ว? <a href="{{ url_for('auth.login') }}">เข้าสู่ระบบ</a>
    </p>
  </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function(e) {
  const pw  = document.getElementById('password').value;
  const cpw = document.getElementById('confirm_password').value;
  if (pw !== cpw) {
    e.preventDefault();
    alert('รหัสผ่านไม่ตรงกัน');
  }
});
</script>
</body>
</html>
