<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ยืนยัน OTP — Election Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-icon gold">
      <svg viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013 8.79a2 2 0 012-2.18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L9.91 14a16 16 0 006 6l.34-.34a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
    </div>
    <div class="auth-title">ยืนยัน OTP</div>
    <div class="auth-sub">กรอกรหัส 6 หลักที่ส่งไปยังอีเมลของคุณ</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" style="margin-bottom:12px;" role="alert">
          <svg class="flash-icon" viewBox="0 0 24 24">
            {% if category == 'success' %}<polyline points="20 6 9 17 4 12"/>
            {% elif category == 'danger' %}<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            {% else %}<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            {% endif %}
          </svg>
          <span class="flash-body">{{ message }}</span>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" id="otpForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="otp_code"  id="otpHidden" />

      {# Digit boxes #}
      <div class="otp-wrap" id="otpBoxes">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" />
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" />
      </div>

      <div class="countdown" id="countdown">
        รหัสหมดอายุใน <strong id="countdownTimer">5:00</strong>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn" disabled>
        ยืนยัน OTP
      </button>
    </form>

    <p style="text-align:center; margin-top:16px; font-size:12px; color:var(--text-3);">
      <a href="{{ url_for('auth.request_otp', election_id=election_id) }}">ส่งรหัสใหม่อีกครั้ง</a>
    </p>

  </div>
</div>

<script>
const digits  = Array.from(document.querySelectorAll('.otp-digit'));
const hidden  = document.getElementById('otpHidden');
const btn     = document.getElementById('submitBtn');
const timerEl = document.getElementById('countdownTimer');

// Focus first
digits[0].focus();

digits.forEach((el, i) => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '');
    if (el.value && i < 5) digits[i + 1].focus();
    syncValue();
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !el.value && i > 0) {
      digits[i - 1].value = '';
      digits[i - 1].focus();
      syncValue();
    }
    if (e.key === 'ArrowLeft'  && i > 0) digits[i - 1].focus();
    if (e.key === 'ArrowRight' && i < 5) digits[i + 1].focus();
  });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
    text.split('').forEach((ch, j) => { if (digits[j]) digits[j].value = ch; });
    const next = Math.min(text.length, 5);
    digits[next].focus();
    syncValue();
  });
  el.addEventListener('focus', () => el.select());
});

function syncValue() {
  const val = digits.map(d => d.value).join('');
  hidden.value = val;
  digits.forEach((d, i) => {
    d.classList.toggle('filled', !!d.value);
  });
  btn.disabled = val.length < 6;
}

// Countdown
let secs = 5 * 60;
const timer = setInterval(() => {
  secs--;
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  if (secs <= 0) {
    clearInterval(timer);
    timerEl.textContent = 'หมดอายุแล้ว';
    timerEl.style.color = 'var(--red)';
    btn.disabled = true;
  }
}, 1000);
</script>
</body>
</html>
