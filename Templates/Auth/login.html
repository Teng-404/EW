<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ — Election Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% include '_pwa_head.html' %}
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>
    <div class="auth-title">เข้าสู่ระบบ</div>
    <div class="auth-sub">เพื่อใช้สิทธิ์ลงคะแนนเสียง</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" style="margin-bottom:12px;" role="alert">
          <svg class="flash-icon" viewBox="0 0 24 24">
            {% if category == 'success' %}<polyline points="20 6 9 17 4 12"/>
            {% elif category == 'danger' %}<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            {% else %}<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            {% endif %}
          </svg>
          <span class="flash-body">{{ message }}</span>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="username">ชื่อผู้ใช้ <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control"
               value="{{ username or '' }}" required autofocus placeholder="กรอกชื่อผู้ใช้" />
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control"
               required placeholder="กรอกรหัสผ่าน" />
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
        <input type="checkbox" id="remember" name="remember"
               style="width:15px; height:15px; accent-color:var(--navy-mid);" />
        <label for="remember" style="margin:0; font-weight:400; font-size:12px; cursor:pointer;">จดจำฉัน</label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">เข้าสู่ระบบ</button>
    </form>

    <p style="text-align:center; margin-top:16px; font-size:12px; color:var(--text-3);">
      ยังไม่มีบัญชี? <a href="{{ url_for('auth.register') }}">สมัครสมาชิก</a>
    </p>

  </div>
</div>
</body>
</html>
