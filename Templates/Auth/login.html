<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ — Election Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="6" fill="#1F3A5F"/>
        <path d="M7 12l3 3 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Election Web</h1>
      <p>เข้าสู่ระบบเพื่อลงคะแนนเสียง</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" style="margin-bottom:1rem;" role="alert">
          <span class="flash-body">{{ message }}</span>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="username">ชื่อผู้ใช้ <span class="required">*</span></label>
        <input type="text" id="username" name="username" class="form-control"
               value="{{ username or '' }}" required autofocus placeholder="กรอกชื่อผู้ใช้" />
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน <span class="required">*</span></label>
        <input type="password" id="password" name="password" class="form-control"
               required placeholder="กรอกรหัสผ่าน" />
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:.5rem;">
        <input type="checkbox" id="remember" name="remember" style="width:auto;" />
        <label for="remember" style="margin:0; font-weight:400; font-size:.88rem; cursor:pointer;">จดจำฉัน</label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">เข้าสู่ระบบ</button>
    </form>

    <p class="text-center text-muted mt-2" style="font-size:.88rem;">
      ยังไม่มีบัญชี? <a href="{{ url_for('auth.register') }}">สมัครสมาชิก</a>
    </p>
  </div>
</div>
</body>
</html>
