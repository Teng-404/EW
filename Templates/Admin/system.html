{% extends "base.html" %}
{% block title %}ตั้งค่าระบบ{% endblock %}

{% block head %}
<style>
.toggle-switch { position:relative; display:inline-block; width:44px; height:24px; flex-shrink:0; }
.toggle-switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; inset:0; background:var(--border); border-radius:24px; transition:.2s; }
.slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
.toggle-switch input:checked + .slider { background:var(--green); }
.toggle-switch input:checked + .slider:before { transform:translateX(20px); }
</style>
{% endblock %}

{% block content %}
<div class="mb-3">
  <h1>ตั้งค่าระบบ</h1>
  <p class="text-muted">เปิด/ระงับการเข้าใช้งานแต่ละระบบ</p>
</div>

<div class="card" style="max-width:480px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('admin.system') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3 d-flex align-center justify-between">
        <div>
          <div style="font-weight:500;">ระบบยืนยันตัวตน</div>
          <div class="text-muted" style="font-size:12px;">สมาชิกกรอก Email รับ OTP ก่อนลงคะแนน</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" name="verify_enabled"
                 {% if settings.get('verify_enabled') == '1' %}checked{% endif %}>
          <span class="slider"></span>
        </label>
      </div>

      <hr style="border-color:var(--border); margin:12px 0;">

      <div class="mb-3 d-flex align-center justify-between">
        <div>
          <div style="font-weight:500;">ระบบลงคะแนน</div>
          <div class="text-muted" style="font-size:12px;">สมาชิกเข้าสู่หน้าลงคะแนนได้</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" name="vote_enabled"
                 {% if settings.get('vote_enabled') == '1' %}checked{% endif %}>
          <span class="slider"></span>
        </label>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary w-100">บันทึกการตั้งค่า</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
